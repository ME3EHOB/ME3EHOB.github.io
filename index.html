<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ME3EH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ME3EH</h1>
        <p>Разработчик игр и контента</p>
    </header>

    <main>
        <section id="countdown-section">
            <h2>До 22 октября осталось:</h2>
            <div class="countdown">
                <div class="time-block">
                    <span id="days">00</span>
                    <p>дней</p>
                </div>
                <div class="time-block">
                    <span id="hours">00</span>
                    <p>часов</p>
                </div>
                <div class="time-block">
                    <span id="minutes">00</span>
                    <p>минут</p>
                </div>
                <div class="time-block">
                    <span id="seconds">00</span>
                    <p>секунд</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 ME3EH</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
